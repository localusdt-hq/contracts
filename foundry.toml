[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "shanghai"

[profile.default.fuzz]
runs = 1000

[etherscan]
ethereum = { key = "${ETHERSCAN_API_KEY}" }
bnb = { key = "${BSCSCAN_API_KEY}", url = "https://api.bscscan.com/api" }
